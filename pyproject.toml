[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rektrush-delivery-audit"
dynamic = ["version"]
description = "Audit webhook deliveries offline for missing, repeated or conflicting events"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Thomas Phillips"}]
keywords = ["webhooks", "reconciliation", "github", "observability", "developer-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/darealrektrush/delivery-audit"
Issues = "https://github.com/darealrektrush/delivery-audit/issues"

[project.scripts]
delivery-audit = "delivery_audit:main"

[tool.setuptools]
py-modules = ["delivery_audit"]
packages = ["delivery_audit_samples"]

[tool.setuptools.package-data]
delivery_audit_samples = ["*.jsonl"]

[tool.setuptools.dynamic]
version = {attr = "delivery_audit.VERSION"}
